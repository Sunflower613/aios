<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>制谱 · 指尖旋律</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./chart-editor.css?v=2"></head>
<body><main class="studio-page">
  <header><button data-action="close" aria-label="返回列表" title="返回列表"><svg viewBox="0 0 32 32"><path d="m19 7-10 9 10 9M10 16h17"/></svg></button><div class="studio-heading"><h2>指尖旋律</h2><small class="chart-name">新谱面</small></div><button data-action="manage" aria-label="谱面管理" title="谱面管理"><svg viewBox="0 0 32 32"><path d="M5 6h22v20H5ZM10 12h12M10 18h8"/></svg></button></header><output class="studio-time">0:00</output>
  <p class="studio-status" role="status">正在加载歌曲…</p>
  <div class="studio-layout"><section class="studio-editor"><label for="lyrics">歌词</label><textarea id="lyrics" class="studio-lyrics" spellcheck="false" placeholder="每句一行，可随时修改"></textarea><label class="studio-file">歌词文件<input type="file" accept=".lrc,.yrc,.txt"></label><p>修改时自动暂停，保留修改处之前的字点。</p></section>
  <section class="studio-preview"><div class="lyrics-heading"><span>歌词</span><button data-action="lyrics" aria-label="编辑歌词" title="编辑歌词"><svg viewBox="0 0 32 32"><path d="M5 7h14M5 14h10M5 21h7m5 3 2-7L26 6l5 4-8 11-6 3Z"/></svg></button></div><div class="studio-words"></div><div class="line-editor"><span class="line-number">第 1 句</span><input class="line-text" aria-label="当前句歌词"><button data-action="redo-line" title="重录当前句" aria-label="重录当前句"><svg viewBox="0 0 32 32"><path d="M8 10a11 11 0 1 1-2 12M7 4v8h8"/></svg></button></div><div class="studio-board" aria-label="制谱轨道，使用 D F J K 点击"><div class="studio-notes"></div><div class="studio-hit"></div><div class="studio-pads"><button data-lane="0" aria-label="第一轨">D</button><button data-lane="1" aria-label="第二轨">F</button><button data-lane="2" aria-label="第三轨">J</button><button data-lane="3" aria-label="第四轨">K</button></div></div><input class="studio-seek" aria-label="播放位置" type="range" min="0" max="1" step="0.01" value="0"></section></div>
  <nav class="studio-toolbar" aria-label="制谱操作">

    <button data-action="undo" aria-label="撤销上一字" title="撤销上一字"><svg viewBox="0 0 32 32"><path d="m11 5-7 7 7 7M5 12h14a8 8 0 0 1 0 16"/></svg></button>
    <button data-action="play" aria-label="播放录制" title="播放录制"><svg viewBox="0 0 32 32"><path d="m11 6 15 10-15 10Z"/></svg></button>

    <button data-action="save" aria-label="保存谱面" title="保存谱面"><svg viewBox="0 0 32 32"><path d="M6 4h17l5 5v19H4V4Zm5 0v8h12V4M10 28V18h12v10"/></svg></button>
  </nav>
<div class="studio-toast" role="status" hidden></div><dialog class="chart-manager"><header><h2>谱面管理</h2><button data-action="manager-close" aria-label="关闭谱面管理"><svg viewBox="0 0 32 32"><path d="m9 9 14 14M23 9 9 23"/></svg></button></header><p>载入后可选择单字或单句修改；保存会生成新版本。</p><div class="chart-list"></div><button data-action="new-chart">新建空白谱面</button></dialog></main><script type="module">import { mountChartEditor } from './chart-editor.mjs?v=2'; mountChartEditor().catch(error => { document.querySelector('.studio-status').textContent = error.message; });</script></body></html>
