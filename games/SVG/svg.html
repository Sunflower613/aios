<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Lavender SVG Studio | 优雅简约的矢量绘图室</title>
    <!-- 引入高品质现代无衬线字体与等宽字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* 优雅紫色简约配色系统 */
            --bg-main: #faf9fc; /* 极轻柔的粉紫灰大背景 */
            --bg-panel: #ffffff; /* 纯白面板 */
            --border-light: #f1eff7; /* 淡紫灰极细边框 */
            --border-hover: #e4dff0;
            
            --purple-primary: #7c3aed; /* 核心深薰衣草紫 */
            --purple-hover: #6d28d9;
            --purple-light: #f5f3ff; /* 激活态超浅背景 */
            --purple-border: #ddd6fe;
            --purple-glow: rgba(124, 58, 237, 0.08);
            
            --text-main: #0f172a; /* 炭黑 */
            --text-muted: #64748b; /* 哑光灰 */
            --text-white: #ffffff;
            
            --shadow-sm: 0 2px 8px rgba(124, 58, 237, 0.02);
            --shadow-md: 0 10px 30px -5px rgba(124, 58, 237, 0.05);
            --shadow-lg: 0 20px 40px -15px rgba(124, 58, 237, 0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        /* 统一的磨砂玻璃卡片 */
        .glass-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        /* 左侧控制面板 */
        .sidebar {
            width: 320px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid var(--border-light);
            background-color: var(--bg-panel);
            z-index: 10;
            overflow-y: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .logo-icon {
            color: var(--purple-primary);
            width: 22px;
            height: 22px;
        }

        .logo-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .sidebar-section {
            margin-bottom: 14px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* 工具模式选择按钮：4列精干纯图标 */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .tool-option {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background-color: var(--bg-panel);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-option:hover {
            border-color: var(--border-hover);
            color: var(--text-main);
            background-color: #fafafc;
        }

        .tool-option.active {
            background-color: var(--purple-light);
            border-color: var(--purple-primary);
            color: var(--purple-primary);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
        }

        .tool-option svg {
            width: 18px;
            height: 18px;
        }

        /* 画布尺寸预设网格 */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .preset-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.75rem;
            background-color: var(--bg-panel);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-main);
        }

        .preset-btn.active {
            background-color: var(--purple-primary);
            border-color: var(--purple-primary);
            color: var(--text-white);
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.15);
        }

        .custom-size-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-group {
            flex: 1;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 6px 10px;
            background-color: #fafafc;
            transition: var(--transition);
        }

        .input-group:focus-within {
            border-color: var(--purple-primary);
            background-color: var(--bg-panel);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }

        .input-group span {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 6px;
        }

        .input-group input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .icon-btn-apply {
            padding: 8px 12px;
            background-color: var(--text-main);
            color: var(--text-white);
            border: none;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn-apply:hover {
            background-color: #1e293b;
        }

        /* 样式控制区（线条与填充） */
        .style-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .style-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .style-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .style-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .style-value {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .color-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-color-picker {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-light);
            border-radius: 50%;
            background: none;
            cursor: pointer;
            transition: var(--transition);
            padding: 0;
            overflow: hidden;
        }

        .custom-color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .custom-color-picker::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        /* 网格对齐/填充使能开关 */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #fafafc;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--purple-primary);
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* 精细滑动条 */
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            transition: var(--transition);
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--purple-primary);
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3);
            transition: var(--transition);
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* 中间主视口 */
        .main-workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        /* 顶部悬浮工具条 */
        .top-toolbar {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            z-index: 100;
        }

        .toolbar-divider {
            width: 1px;
            height: 20px;
            background-color: var(--border-light);
            margin: 0 4px;
        }

        .action-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background-color: var(--bg-panel);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .action-icon-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-main);
            background-color: #fafafc;
        }

        .action-icon-btn.active {
            border-color: var(--purple-primary);
            color: var(--purple-primary);
            background-color: rgba(124, 58, 237, 0.08);
            box-shadow: 0 0 8px rgba(124, 58, 237, 0.18);
        }

        .action-icon-btn.active:hover {
            background-color: rgba(124, 58, 237, 0.12);
        }

        .action-icon-btn.danger:hover {
            border-color: #fca5a5;
            color: #ef4444;
            background-color: #fef2f2;
        }

        .action-icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #fafafc;
            border-color: var(--border-light);
        }

        .action-icon-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 画布装载与外围包裹 */
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        /* 画布本身，像悬浮的精美画纸 */
        .canvas-paper {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(124, 58, 237, 0.04);
            position: relative;
            /* 自定义双色高对比度游标（紫色芯线 + 白色高亮描边保护），热点精确位于十字中心 12 12 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke="%23ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M12 3v18M3 12h18" stroke="%237c3aed" stroke-width="1.5" stroke-linecap="round"/></svg>') 12 12, crosshair;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), height 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: visible;
        }

        /* 智能线性像素网格背景 */
        svg#paint-canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            /* 细线网络背景 */
            background-image: 
                linear-gradient(to right, rgba(124, 58, 237, var(--grid-opacity, 0.05)) var(--grid-stroke-width, 1px), transparent var(--grid-stroke-width, 1px)),
                linear-gradient(to bottom, rgba(124, 58, 237, var(--grid-opacity, 0.05)) var(--grid-stroke-width, 1px), transparent var(--grid-stroke-width, 1px));
            background-size: var(--grid-size, 20px) var(--grid-size, 20px);
            background-color: #ffffff;
            overflow: visible;
        }

        /* 底部精密状态栏 */
        .status-bar {
            height: 38px;
            border-top: 1px solid var(--border-light);
            background-color: var(--bg-panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
            z-index: 10;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #10b981; /* 默认运行中绿色 */
        }
        
        .status-dot.working {
            background-color: var(--purple-primary);
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 右侧代码抽屉栏 */
        .code-drawer {
            width: 360px;
            min-width: 360px;
            border-left: 1px solid var(--border-light);
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
            transition: var(--transition);
            overflow-y: auto;
        }

        /* 示例模板卡片样式 */
        .template-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            background-color: var(--bg-panel);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            gap: 6px;
        }

        .template-card:hover {
            border-color: var(--purple-primary);
            background-color: var(--purple-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.06);
        }

        .template-card svg {
            width: 32px;
            height: 32px;
            transition: var(--transition);
        }

        .template-card:hover svg {
            transform: scale(1.1);
        }

        .template-card-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .template-card:hover .template-card-title {
            color: var(--purple-primary);
        }

        .code-drawer.collapsed {
            width: 0px;
            min-width: 0px;
            padding: 0;
            overflow: hidden;
            border-left: none;
        }

        .code-area-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            margin-bottom: 20px;
        }

        textarea#code-output {
            flex-grow: 1;
            width: 100%;
            padding: 16px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            line-height: 1.5;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            background-color: #FAF9FB;
            color: #474354;
            resize: none;
            outline: none;
            transition: var(--transition);
        }

        textarea#code-output:focus {
            border-color: var(--purple-primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--purple-glow);
        }

        .drawer-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background-color: var(--purple-primary);
            color: var(--text-white);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }

        .drawer-action-btn:hover {
            background-color: var(--purple-hover);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.3);
        }

        .drawer-action-btn.secondary {
            background-color: var(--text-main);
            box-shadow: none;
        }
        .drawer-action-btn.secondary:hover {
            background-color: #1e293b;
        }

        /* 展开/折叠代码区的悬浮按钮 */
        .toggle-drawer-btn {
            position: absolute;
            right: 24px;
            top: 24px;
            z-index: 100;
        }

        /* 气泡提示 */
        .toast {
            position: fixed;
            bottom: 60px;
            right: 40px;
            background-color: #10b981;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.25);
            transform: translateY(30px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.30s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* 默认情况下，画布里的子图形不响应任何鼠标事件，防止干扰绘图 */
        svg#paint-canvas > *:not(.bezier-helper) {
            pointer-events: none;
        }

        /* 仅在橡皮擦或油漆桶激活时，子图形才响应事件并改为 pointer */
        body.eraser-mode svg#paint-canvas > *:not(.bezier-helper),
        body.paintbucket-mode svg#paint-canvas > *:not(.bezier-helper) {
            pointer-events: auto;
            cursor: pointer;
        }

        /* 橡皮擦激活时的鼠标游标：红芯白边小圆圈，指代擦除圈 */
        body.eraser-mode .canvas-paper {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" stroke="%23ffffff" stroke-width="2.5" fill="none"/><circle cx="12" cy="12" r="6" stroke="%23ef4444" stroke-width="1.2" fill="rgba(239,68,68,0.15)"/></svg>') 12 12, pointer;
        }

        /* 油漆桶激活时的鼠标游标：紫色小圆圈 */
        body.paintbucket-mode .canvas-paper {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" stroke="%23ffffff" stroke-width="2.5" fill="none"/><circle cx="12" cy="12" r="5" stroke="%237c3aed" stroke-width="1.5" fill="rgba(124,58,237,0.2)"/></svg>') 12 12, pointer;
        }

        /* 橡皮擦悬浮：红色滤镜和高亮外发光 */
        .erase-highlight {
            filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.8)) !important;
            opacity: 0.6 !important;
        }

        /* 油漆桶悬浮：紫色滤镜和发光轮廓 */
        .fill-highlight {
            filter: drop-shadow(0 0 4px rgba(124, 58, 237, 0.8)) !important;
        }

        /* 画布预设分类选项卡样式 */
        .cat-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 0;
            border: none;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            background: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .cat-tab:hover {
            color: var(--text-main);
            background-color: rgba(124, 58, 237, 0.04);
        }

        .cat-tab.active {
            background-color: var(--purple-primary) !important;
            color: var(--text-white) !important;
            box-shadow: var(--shadow-sm);
        }

        /* ================= 移动端响应式与自适应适配 ================= */
        
        /* 1. 移动端及中等屏幕设备 (手机与平板，宽度 <= 1024px) */
        @media (max-width: 1024px) {
            .app-container {
                position: relative;
            }

            /* 侧边栏转换为侧滑抽屉 */
            .sidebar {
                position: fixed;
                left: -320px;
                top: 0;
                bottom: 0;
                height: 100vh;
                box-shadow: var(--shadow-lg);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 1000;
            }

            .sidebar.sidebar-open {
                transform: translateX(320px);
            }

            /* 遮罩层 */
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(15, 23, 42, 0.4);
                backdrop-filter: blur(4px);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                z-index: 999;
            }

            .sidebar-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            /* 汉堡按钮显现 */
            #btn-toggle-sidebar {
                display: flex !important;
            }

            /* 代码抽屉转换为侧滑抽屉（限制平板下最大宽度，防止 100% 拉伸） */
            .code-drawer {
                position: fixed;
                right: -380px;
                top: 0;
                bottom: 0;
                width: 380px !important;
                min-width: 380px !important;
                z-index: 1010;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: var(--shadow-lg);
            }

            .code-drawer:not(.collapsed) {
                transform: translateX(-380px);
            }

            /* 在窄屏手机上代码抽屉强制 100% 宽度 */
            @media (max-width: 480px) {
                .code-drawer {
                    right: -100%;
                    width: 100% !important;
                    min-width: 100% !important;
                }
                .code-drawer:not(.collapsed) {
                    transform: translateX(-100%);
                }
            }

            /* 缩微顶部工具条以适配移动端宽度，支持横卷 */
            .top-toolbar {
                top: 12px;
                padding: 6px 8px;
                gap: 4px;
                max-width: calc(100vw - 80px); /* 留出右侧代码按钮空间 */
                left: 12px;
                transform: none;
                overflow-x: auto;
                scrollbar-width: none; /* 隐藏滚动条 */
            }
            .top-toolbar::-webkit-scrollbar {
                display: none;
            }

            .action-icon-btn {
                width: 32px;
                height: 32px;
                border-radius: 8px;
                flex-shrink: 0;
            }

            .action-icon-btn svg {
                width: 16px;
                height: 16px;
            }

            #zoom-value {
                font-size: 0.7rem;
                min-width: 44px;
            }

            .toolbar-divider {
                height: 16px;
                margin: 0 2px;
            }
            
            /* 代码抽屉折叠展开按钮：提高层级，使其永不被展开的代码抽屉遮挡 */
            .toggle-drawer-btn {
                right: 12px;
                top: 12px;
                width: 34px;
                height: 34px;
                border-radius: 8px;
                z-index: 1020 !important;
            }

            /* 移动端状态栏极致简化排版，防止挤压折行 */
            .status-bar {
                padding: 0 16px !important;
                font-size: 0.7rem;

            .status-divider,
            #status-sys-item,
            #status-coords-item,
            #status-count-item,
            .status-label {
                display: none !important;
            }
            .status-left, .status-right {
                gap: 8px !important;
            }
        }

        /* 2. 横屏/极矮屏幕手机自适应适配 (高度 <= 500px) */
        @media (max-height: 500px) {
            .top-toolbar {
                top: 6px !important;
                padding: 4px 6px;

                top: 6px !important;

                display: none !important; /* 横屏隐藏状态栏以腾出空间 */
            }
            .sidebar {
                padding-top: 10px;
            }
            .logo-area {
                margin-bottom: 8px;
            }
        }
    </style>
</head>
<body>

                            <input type="color" class="custom-color-picker" id="fill-color" value="#7c3aed" style="width: 28px; height: 28px;">
                            <span class="style-value" id="fill-color-val" style="font-size: 0.7rem; font-family: 'JetBrains Mono', monospace;">#7c3aed</span>

                <!-- 网格对齐刻度只读指示 (快捷开关移至顶部工具栏) -->
                <div class="toggle-container" style="justify-content: center; background-color: transparent; border: none; padding: 0; margin-top: 2px;">
                    <span class="style-label" id="snap-text" style="font-size:0.7rem; color: var(--text-muted); font-weight: 500;">对齐到网格 (20px)</span>

    <!-- 中间画板视口 -->
    <div class="main-workspace">
        
        <!-- 悬浮撤销重做工具条 + 缩放控制 -->
        <div class="top-toolbar glass-card">
            <!-- 手机端汉堡菜单开关 -->
            <button class="action-icon-btn" id="btn-toggle-sidebar" title="展开控制面板" style="display: none; margin-right: 4px;">
                <i data-lucide="menu"></i>
            </button>
            <button class="action-icon-btn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>
                <i data-lucide="undo-2"></i>
            </button>
            <button class="action-icon-btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>
                <i data-lucide="redo-2"></i>
            </button>
            <button class="action-icon-btn danger" id="btn-clear" title="清空画布">
                <i data-lucide="trash-2"></i>
            </button>
            
            <div class="toolbar-divider"></div>
            
            <!-- 快捷绘图控制组 -->
            <button class="action-icon-btn" id="btn-toggle-snap" title="对齐网格">
                <i data-lucide="grid"></i>
            </button>
            <button class="action-icon-btn" id="btn-toggle-fill" title="启用填充">
                <i data-lucide="droplet"></i>

            <div class="toolbar-divider"></div>
            
            <!-- 缩放控制组 -->

            <button class="action-icon-btn" id="btn-zoom-in" title="放大 (Ctrl+滚轮)">

        <!-- 画布工作台 -->
        <div class="canvas-container">

                <span class="status-divider">|</span>
                <div class="status-item" id="status-count-item">

    <!-- 右侧代码栏 -->

            <i data-lucide="download" style="width: 16px; height: 16px;"></i>
