<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>苏富比高定拍卖行 - 一起做裙子</title>
    <link rel="stylesheet" href="css/tailor.css">
    <!-- Iconify 矢量图标库 -->
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <!-- Three.js 核心库 -->
    <script src="../../3d-home/node_modules/three/build/three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'"></script>
    <script src="js/pattern-engine.js"></script>
    <script src="js/store.js"></script>
    <script src="js/audio-synth.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 20%, #221820 0%, #120e11 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #fce8eb;
        }

        .auction-page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 顶部导航 (移动端紧凑) */
        .auction-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(18, 14, 17, 0.92);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            z-index: 10;
            gap: 8px;
        }

        .auction-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gold-gavel-icon {
            color: var(--gold-primary);
            font-size: 20px;
            flex-shrink: 0;
        }

        .auction-brand h1 {
            margin: 0;
            font-size: 15px;
            font-family: var(--font-serif);
            letter-spacing: 1px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 主舞台双栏网格 (移动端自适应分栏，使用 100dvh) */
        .auction-main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            height: calc(100vh - 50px);
            height: calc(100dvh - 50px);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .auction-main-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 42dvh calc(58dvh - 50px);
            }
        }

        /* 左侧 3D 展台区 */
        .auction-3d-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at center, rgba(224, 99, 124, 0.12) 0%, rgba(0,0,0,0) 75%);
            overflow: hidden;
        }

        #canvasAuctionDress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 裙身下方浮动铭牌 (移动端极简微型化，绝不遮挡模特大半身) */
        .dress-info-plaque {
            position: relative;
            z-index: 5;
            margin: 8px 10px;
            align-self: flex-start;
            background: rgba(18, 14, 17, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 5px 10px;
            max-width: calc(100% - 20px);
            box-sizing: border-box;
        }

        .plaque-title {
            font-family: var(--font-serif);
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .plaque-tag {
            font-size: 10px;
            color: var(--gold-primary);
            margin: 2px 0 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .plaque-metrics {
            display: flex;
            gap: 8px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.75);
            flex-wrap: wrap;
        }

        .plaque-metrics b {
            color: var(--pink-primary);
        }

        @media (max-width: 768px) {
            .dress-info-plaque {
                margin: 6px 8px;
                padding: 4px 8px;
            }
            .plaque-tag {
                display: none; /* 移动端隐藏次要口号，释放视野 */
            }
        }

        /* 右侧叫价大厅 (移动端紧凑滚动) */
        .auction-hall-dock {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            padding: 10px 14px max(12px, env(safe-area-inset-bottom));
            background: rgba(24, 18, 22, 0.88);
            border-left: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(20px);
            overflow-y: auto;
            box-sizing: border-box;
        }

        .bidding-podium {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.14), rgba(224, 99, 124, 0.08));
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .bidding-podium-label {
            font-size: 10px;
            color: var(--gold-primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .current-price-big {
            font-size: 32px;
            font-family: var(--font-serif);
            font-weight: 700;
            color: #fff;
            margin: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
        }

        .current-buyer-badge {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
        }

        .bidders-stream-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            overflow-y: auto;
        }

        .bidder-stream-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .bidder-stream-card.highlight {
            background: rgba(224, 99, 124, 0.2);
            border-color: var(--pink-primary);
            transform: translateX(3px);
        }

        .bidder-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .bidder-meta {
            flex: 1;
            overflow: hidden;
        }

        .bidder-name-row {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        .bidder-speech-quote {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bidder-raise-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-primary);
            white-space: nowrap;
        }

        /* 拍卖行动作栏 */
        .auction-action-bar {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-hammer-deal {
            flex: 1;
            background: linear-gradient(135deg, #d4af37, #b88d22);
            color: #2a1f24;
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.2s ease;
        }

        .btn-hammer-deal:hover {
            transform: scale(1.02);
        }

        /* 拍卖成交证书卡片模态浮层 (移动端全屏居中适配，防溢出) */
        .deal-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(10, 8, 10, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .deal-card-overlay.show {
            display: flex;
        }

        .sotheby-certificate-card {
            width: 100%;
            max-width: 400px;
            max-height: 90dvh;
            overflow-y: auto;
            background: #faf7f0;
            color: #2a1f24;
            border-radius: 14px;
            border: 2px solid #d4af37;
            padding: 14px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.85);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        @media (max-width: 768px) {
            .bidding-podium {
                padding: 6px 10px;
                margin-bottom: 6px;
            }
            .current-price-big {
                font-size: 24px;
                margin: 2px 0;
            }
            .bidders-stream-box {
                gap: 5px;
                margin-bottom: 8px;
            }
            .bidder-stream-card {
                padding: 5px 8px;
            }
            .bidder-speech-quote {
                display: none; /* 移动端隐去长篇语录，保持紧凑 */
            }
            .sotheby-certificate-card {
                padding: 10px;
                max-height: 88dvh;
            }
            .cert-photo-frame {
                height: 120px !important;
                margin: 6px 0 !important;
            }
            .cert-title {
                font-size: 14px !important;
            }
            .cert-price-row {
                font-size: 17px !important;
            }
        }

        .cert-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
        }

        .cert-stamp-scissors {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fdf2f4;
            border: 1px solid #d4af37;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-bottom: 3px;
        }

        .cert-title {
            font-family: var(--font-serif);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #4a1525;
            margin: 0;
        }

        .cert-subtitle {
            font-size: 9px;
            letter-spacing: 1px;
            color: #9e8979;
            text-transform: uppercase;
        }

        .cert-photo-frame {
            width: 100%;
            height: 150px;
            background: #1f181c;
            border-radius: 6px;
            overflow: hidden;
            margin: 8px 0;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cert-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cert-body-info {
            width: 100%;
            font-size: 11px;
            line-height: 1.5;
            color: #55443a;
            border-top: 1px dashed #d4af37;
            border-bottom: 1px dashed #d4af37;
            padding: 8px 0;
            margin-bottom: 10px;
        }

        .cert-price-row {
            font-size: 20px;
            font-family: var(--font-serif);
            font-weight: 700;
            color: #8c263e;
            margin-top: 2px;
        }

        .cert-actions-dock {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .btn-download-card {
            flex: 1;
            background: linear-gradient(135deg, #e0637c, #b8334e);
            color: #fff;
            border: none;
            padding: 9px 8px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-next-chapter {
            flex: 1;
            background: linear-gradient(135deg, #d4af37, #b88d22);
            color: #2a1f24;
            border: none;
            padding: 9px 8px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auction-page-container">
        <!-- 顶部导航 -->
        <header class="auction-header-bar">
            <div class="auction-brand">
                <span class="iconify gold-gavel-icon" data-icon="lucide:gavel"></span>
                <h1>苏富比拍卖盛会</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="auction-music-dock" style="display: flex; align-items: center; gap: 5px;">
                    <button class="btn-secondary" id="btnToggleAuctionMusic" style="padding: 4px 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(212,175,55,0.3); border-radius: 14px;">
                        <span class="iconify" id="iconAuctionMusic" data-icon="lucide:disc-3"></span>
                        <span id="textAuctionMusic">拍卖音</span>
                    </button>
                    <button class="btn-secondary" id="btnNextAuctionMusic" style="padding: 4px 7px; font-size: 11px; display: inline-flex; align-items: center; gap: 2px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(212,175,55,0.3); border-radius: 14px;">
                        <span class="iconify" data-icon="lucide:skip-forward"></span>
                        <span>切曲</span>
                    </button>
                </div>
                <button class="btn-secondary" id="btnBackToTailor" style="padding: 5px 12px; font-size: 11px; white-space: nowrap;">
                    <span class="iconify" data-icon="lucide:arrow-left"></span>
                    <span>回工坊</span>
                </button>
            </div>
        </header>

        <!-- 主舞台双栏 -->
        <main class="auction-main-grid">
            <!-- 左侧 3D 展台展示裙身 -->
            <div class="auction-3d-stage">
                <canvas id="canvasAuctionDress"></canvas>

                <!-- 裙身铭牌 -->
                <div class="dress-info-plaque">
                    <div class="plaque-title" id="plaqueDressName">古希腊基同裙 #1</div>
                    <div class="plaque-tag">
                        <span class="iconify" data-icon="lucide:sparkles"></span>
                        <span>第一篇章 · 以布为形</span>
                    </div>
                    <div class="plaque-metrics">
                        <span>面料：<b id="plaqueFabricName">手织原麻</b></span>
                        <span>裁剪：<b id="plaqueCutAcc">98%</b></span>
                        <span>缝纫：<b id="plaqueSewAcc">96%</b></span>
                    </div>
                </div>
            </div>

            <!-- 右侧叫价大厅 -->
            <div class="auction-hall-dock">
                <!-- 竞价讲台 -->
                <div class="bidding-podium">
                    <div class="bidding-podium-label">当前叫价 (CURRENT BID)</div>
                    <div class="current-price-big">
                        <span id="textCurrentBid">180</span>
                        <span class="iconify" data-icon="lucide:coins" style="color: var(--gold-primary); font-size: 24px;"></span>
                    </div>
                    <div class="current-buyer-badge" id="textLeadingBuyer">等待贵宾起拍...</div>
                </div>

                <!-- 动态举牌出价流 -->
                <div class="bidders-stream-box" id="biddersStreamContainer">
                    <!-- 动态买家卡片 -->
                </div>

                <!-- 拍卖控制底栏 (文字≤4字) -->
                <div class="auction-action-bar">
                    <button class="btn-hammer-deal" id="btnHammer">
                        <span class="iconify" data-icon="lucide:gavel"></span>
                        <span>落槌成交</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- 成交证书与拍立得截图卡片浮层 -->
        <div class="deal-card-overlay" id="dealCardOverlay">
            <div class="sotheby-certificate-card" id="certificateCard">
                <div class="cert-header">
                    <div class="cert-stamp-scissors">
                        <span class="iconify" data-icon="lucide:scissors"></span>
                    </div>
                    <div class="cert-title">高定拍卖成交证书</div>
                    <div class="cert-subtitle">HAUTE COUTURE CERTIFICATE</div>
                </div>

                <!-- 3D 裙身抓拍照片框 -->
                <div class="cert-photo-frame">
                    <img id="certDressSnapshot" alt="高定裙身快照">
                </div>

                <div class="cert-body-info">
                    <div>作品系列：<b id="certDressTitle">古希腊基同裙</b></div>
                    <div style="margin-top: 3px; font-style: italic; color: #78263e;" id="certBuyerQuote">“线条如多立克柱般自然流动！”</div>
                    <div class="cert-price-row">
                        <span>落槌价：</span>
                        <span id="certFinalPrice">380 币</span>
                    </div>
                </div>

                <div class="cert-actions-dock">
                    <button class="btn-download-card" id="btnDownloadCard">
                        <span class="iconify" data-icon="lucide:download"></span>
                        <span>保存卡片</span>
                    </button>
                    <button class="btn-next-chapter" id="btnNextChapter">
                        <span class="iconify" data-icon="lucide:unlock"></span>
                        <span>下一篇章</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const store = window.tailorStore;
            const dress = store.getActiveDraft();
            store.currentDress = dress;
            if (!dress.cutting.completed || !dress.sewing.completed || store.state.completedOrders.some(item => item.id === dress.id)) {
                window.location.replace('tailor.html');
                return;
            }

            // 填充铭牌
            const plaqueName = document.getElementById('plaqueDressName');
            const plaqueFab = document.getElementById('plaqueFabricName');
            const plaqueCut = document.getElementById('plaqueCutAcc');
            const plaqueSew = document.getElementById('plaqueSewAcc');

            if (plaqueName) plaqueName.innerText = dress.name || '古希腊基同裙 #1';
            if (plaqueFab) plaqueFab.innerText = (dress.fabric && dress.fabric.name) || '手织原麻';
            if (plaqueCut) plaqueCut.innerText = `${(dress.cutting && dress.cutting.accuracy) || 98}%`;
            if (plaqueSew) plaqueSew.innerText = `${(dress.sewing && dress.sewing.accuracy) || 96}%`;

            // 3D 展台高定清透光照与渲染
            const canvas = document.getElementById('canvasAuctionDress');
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const width = rect.width || (window.innerWidth * 0.55);
            const height = rect.height || (window.innerHeight * 0.5);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
            camera.position.set(0, 1.25, 3.8);
            camera.lookAt(0, 0.78, 0);

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 开启 sRGB 空间，彻底告别线性暗沉！
            if ('outputColorSpace' in renderer) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else if ('outputEncoding' in renderer) {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            // =========================================================================
            // 核心修复：高定展厅级清透柔光系统 (杜绝过曝纯白，还原真实选布色泽)
            // =========================================================================
            // 1. 全向环境漫射光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            // 2. 半球漫射光
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xfce8ec, 0.65);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);

            // 3. 正面主打光
            const frontDir = new THREE.DirectionalLight(0xfffaf5, 0.6);
            frontDir.position.set(0, 1.5, 4.5);
            scene.add(frontDir);

            // 4. 前上方 45° 聚光灯
            const spot = new THREE.SpotLight(0xfffaf2, 1.35);
            spot.position.set(2, 5.5, 3.5);
            spot.angle = Math.PI / 4.0;
            spot.penumbra = 0.8;
            spot.castShadow = true;
            spot.shadow.bias = -0.001;
            scene.add(spot);

            // 5. 侧光与轮廓光
            const fillLight = new THREE.DirectionalLight(0xfce8ec, 0.45);
            fillLight.position.set(-2.5, 2.8, 2.5);
            scene.add(fillLight);

            const rim = new THREE.DirectionalLight(0xd4af37, 0.55);
            rim.position.set(0, 3.5, -3.5);
            scene.add(rim);

            // 旋转黄铜展台
            const stageGroup = new THREE.Group();
            scene.add(stageGroup);

            const baseGeo = new THREE.CylinderGeometry(0.55, 0.62, 0.08, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.25 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = -0.55;
            baseMesh.receiveShadow = true; // 仅底座接收投影
            stageGroup.add(baseMesh);

            // 裙身几何网格 (优先还原玩家自由裁剪的 customProfile 轮廓)
            const m = dress.mannequin || { shoulder: 1.05, bust: 1.0, waist: 0.95, hips: 1.12, hemWidth: 1.45, length: 1.35 };
            const f = dress.fabric || { color: '#dfb4aa', textureUrl: 'assets/textures/fabric_knit_chevron_cream.jpg' };
            const hemY = -0.36 * (m.length || 1.3);

            const profilePoints = store.smoothProfile(store.getDressProfile(dress)).map(p => new THREE.Vector2(p.radius, p.y));
            const geometry = new THREE.LatheGeometry(profilePoints, 64);
            const posAttr = geometry.attributes.position;
            const vertex = new THREE.Vector3();
            for (let i = 0; i < posAttr.count; i++) {
                vertex.fromBufferAttribute(posAttr, i);
                const angle = Math.atan2(vertex.z, vertex.x);
                const heightRatio = Math.max(0, (1.1 - vertex.y) / (1.1 - hemY));
                const pleatWave = Math.sin(angle * 22) * 0.028 * heightRatio;
                const radius = Math.sqrt(vertex.x * vertex.x + vertex.z * vertex.z);
                const newRadius = radius + pleatWave;
                vertex.x = Math.cos(angle) * newRadius;
                vertex.z = Math.sin(angle) * newRadius;
                posAttr.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            geometry.computeVertexNormals();

            // 真实使用玩家在工坊中选定的面料颜色
            const clothColorHex = f.color || '#f6f3eb';
            const mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(clothColorHex),
                roughness: f.roughness !== undefined ? f.roughness : 0.6,
                metalness: 0.02,
                side: THREE.DoubleSide
            });

            if (f.textureUrl) {
                new THREE.TextureLoader().load(f.textureUrl, (tex) => {
                    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                    tex.repeat.set(3.5, 3.5);
                    mat.map = tex;
                    mat.needsUpdate = true;
                }, undefined, () => {
                    console.log('使用高定纯色丝光质感');
                });
            }

            const dressMesh = new THREE.Mesh(geometry, mat);
            dressMesh.castShadow = true;
            // 关键关闭自阴影遮蔽
            dressMesh.receiveShadow = false;
            stageGroup.add(dressMesh);

            // 附着配饰
            (dress.accessories || []).forEach(acc => {
                if (acc.type === 'fibula') {
                    const boss = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.045, 0.045, 0.012, 24),
                        new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.88, roughness: 0.22 })
                    );
                    boss.rotation.x = Math.PI / 2;
                    const posPct = acc.posPercent || acc.defaultPos || { x: 34, y: 22 };
                    boss.position.set(((posPct.x - 50) / 50) * 0.38, 1.62 - (posPct.y / 100) * 1.50, 0.22);
                    stageGroup.add(boss);
                } else if (acc.type === 'belt') {
                    const belt = new THREE.Mesh(
                        new THREE.TorusGeometry(0.19, 0.015, 12, 48),
                        new THREE.MeshStandardMaterial({ color: 0xd4c2a5, roughness: 0.85, metalness: 0.05 })
                    );
                    belt.rotation.x = Math.PI / 2;
                    belt.position.y = 0.95;
                    stageGroup.add(belt);
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                stageGroup.rotation.y += 0.008; // 平滑自转
                renderer.render(scene, camera);
            }
            animate();

            // 拍卖买家逻辑与动态举牌
            const buyers = [
                { name: '安娜·主编', role: 'Vogue 欧洲版主编', quote: '“这种自然垂褶简直是古典美学的文艺复兴，我要上封面！”', icon: 'lucide:glasses' },
                { name: '玛格丽特公爵夫人', role: '摩纳哥王室名媛', quote: '“出价翻倍！今年游艇派对非它莫属。”', icon: 'lucide:crown' },
                { name: '亨利·大都会馆长', role: '国家服饰博物馆策展人', quote: '“难得一见的古希腊纤布拉工艺，博物馆已批准专项典藏！”', icon: 'lucide:landmark' },
                { name: '米兰买手店主理人', role: '先锋买手主理', quote: '“纯手工亚麻质感，年轻人必定追捧，加码！”', icon: 'lucide:palette' }
            ];

            const evaluation = store.evaluateDress(dress);
            let currentBid = evaluation.value;
            let currentWinner = buyers[0];
            const bidText = document.getElementById('textCurrentBid');
            bidText.textContent = currentBid;
            plaqueName.textContent = `${dress.name} · ${'★'.repeat(evaluation.stars)} ${evaluation.total} 分`;
            const buyerText = document.getElementById('textLeadingBuyer');
            const streamBox = document.getElementById('biddersStreamContainer');

            streamBox.innerHTML = '';
            buyers.forEach((b, idx) => {
                const card = document.createElement('div');
                card.className = 'bidder-stream-card';
                card.id = `bidder_card_${idx}`;
                card.innerHTML = `
                    <div class="bidder-avatar">
                        <span class="iconify" data-icon="${b.icon}"></span>
                    </div>
                    <div class="bidder-meta">
                        <div class="bidder-name-row">${b.name} · <span style="font-size:10px; color:rgba(255,255,255,0.5);">${b.role}</span></div>
                        <div class="bidder-speech-quote">${b.quote}</div>
                    </div>
                    <div class="bidder-raise-tag" id="raise_tag_${idx}">准备举牌</div>
                `;
                streamBox.appendChild(card);
            });

            let round = 0;
            const maxRounds = 6;
            const bidTimer = setInterval(() => {
                round++;
                const bIdx = Math.floor(Math.random() * buyers.length);
                const b = buyers[bIdx];
                currentWinner = b;

                const raise = Math.floor(Math.random() * 30) + 20;
                currentBid += raise;
                window.tailorAudio.playTapeTick(1.5);

                if (bidText) bidText.innerText = currentBid;
                if (buyerText) buyerText.innerText = `领先：${b.name} (${currentBid} 币)`;

                document.querySelectorAll('.bidder-stream-card').forEach(c => c.classList.remove('highlight'));
                const card = document.getElementById(`bidder_card_${bIdx}`);
                const tag = document.getElementById(`raise_tag_${bIdx}`);
                if (card) card.classList.add('highlight');
                if (tag) tag.innerText = `+${raise} 币`;

                if (round >= maxRounds) {
                    clearInterval(bidTimer);
                }
            }, 1800);

            // 落槌成交并生成证书
            const btnHammer = document.getElementById('btnHammer');
            const dealOverlay = document.getElementById('dealCardOverlay');

            btnHammer.addEventListener('click', () => {
                if (!store.settleDress(dress, currentBid)) return;
                btnHammer.disabled = true;
                clearInterval(bidTimer);
                window.tailorAudio.playGavelHit();
                setTimeout(() => window.tailorAudio.playCoinReward(), 220);
                setTimeout(() => window.tailorAudio.playApplause(2.8), 380);


                // 抓取 3D 裙身截图
                renderer.render(scene, camera);
                const snapshotDataUrl = canvas.toDataURL('image/png');

                const imgEl = document.getElementById('certDressSnapshot');
                const titleEl = document.getElementById('certDressTitle');
                const priceEl = document.getElementById('certFinalPrice');
                const quoteEl = document.getElementById('certBuyerQuote');

                if (imgEl) imgEl.src = snapshotDataUrl;
                if (titleEl) titleEl.innerText = dress.name || '古希腊基同裙 #1';
                if (priceEl) priceEl.innerText = `${currentBid} 金币`;
                if (quoteEl) quoteEl.innerText = currentWinner.quote;

                // 保存到沙龙展厅
                store.saveToSalon(dress, snapshotDataUrl);

                // 解锁第二篇章
                document.querySelector('#btnNextChapter span:last-child').textContent = '领取下一份委托';

                if (dealOverlay) dealOverlay.classList.add('show');
            });

            // 保存卡片到本地 (HTML5 Canvas 导出高保真证书卡片)
            document.getElementById('btnDownloadCard').addEventListener('click', () => {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = 600;
                offCanvas.height = 760;
                const ctx = offCanvas.getContext('2d');

                ctx.fillStyle = '#faf7f0';
                ctx.fillRect(0, 0, 600, 760);

                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 6;
                ctx.strokeRect(15, 15, 570, 730);

                ctx.strokeStyle = '#b88d22';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(22, 22, 556, 716);

                ctx.fillStyle = '#4a1525';
                ctx.font = 'bold 24px serif';
                ctx.textAlign = 'center';
                ctx.fillText('苏富比高定拍卖成交证书', 300, 75);

                ctx.fillStyle = '#9e8979';
                ctx.font = '11px sans-serif';
                ctx.fillText('HAUTE COUTURE AUCTION CERTIFICATE', 300, 95);

                const img = document.getElementById('certDressSnapshot');
                if (img && img.complete) {
                    ctx.drawImage(img, 100, 115, 400, 360);
                }

                ctx.fillStyle = '#55443a';
                ctx.font = '15px serif';
                ctx.fillText(`作品名称：${dress.name || '古希腊基同裙 #1'}`, 300, 520);
                ctx.font = '13px sans-serif';
                ctx.fillStyle = '#8c7b70';
                ctx.fillText('第一篇章 · 以布为形自然垂坠', 300, 545);

                ctx.fillStyle = '#78263e';
                ctx.font = 'italic 13px serif';
                ctx.fillText(currentWinner.quote, 300, 580);

                ctx.fillStyle = '#b8334e';
                ctx.font = 'bold 30px serif';
                ctx.fillText(`成交落槌价：${currentBid} 币`, 300, 640);

                ctx.fillStyle = '#d4af37';
                ctx.font = '12px sans-serif';
                ctx.fillText('[SEAL] SOTHEBY\'S HAUTE COUTURE 2026', 300, 690);

                const link = document.createElement('a');
                link.download = `${dress.name || '古希腊基同裙'}_拍卖成交证书.png`;
                link.href = offCanvas.toDataURL('image/png');
                link.click();
            });

            document.getElementById('btnNextChapter').addEventListener('click', () => {
                store.startNewDress();
                window.location.href = 'tailor.html';
            });

            document.getElementById('btnBackToTailor').addEventListener('click', () => {
                if (store.state.completedOrders.some(item => item.id === dress.id)) store.startNewDress();
                window.location.href = 'tailor.html';
            });

            window.addEventListener('resize', () => {
                const nr = container.getBoundingClientRect();
                const nw = nr.width || (window.innerWidth * 0.55);
                const nh = nr.height || (window.innerHeight * 0.5);
                camera.aspect = nw / nh;
                camera.updateProjectionMatrix();
                renderer.setSize(nw, nh);
            });

            // =========================================================================
            // 苏富比拍卖行专属音乐系统：博凯里尼小步舞曲 / 拉莫羽管键琴 / 莫扎特浪漫曲
            // =========================================================================
            const audio = window.tailorAudio;
            const btnToggleMusic = document.getElementById('btnToggleAuctionMusic');
            const btnNextMusic = document.getElementById('btnNextAuctionMusic');
            const iconMusic = document.getElementById('iconAuctionMusic');
            const textMusic = document.getElementById('textAuctionMusic');

            if (audio && btnToggleMusic && btnNextMusic) {
                // 载入拍卖行专属古典名曲歌单并启动
                audio.setScene('auction', true);
                updateMusicUI();

                btnToggleMusic.addEventListener('click', () => {
                    audio.toggleBgm();
                    updateMusicUI();
                });

                btnNextMusic.addEventListener('click', () => {
                    audio.nextTrack();
                    updateMusicUI();
                });
            }

            function updateMusicUI() {
                if (!audio || !textMusic || !iconMusic) return;
                if (audio.bgmPlaying && !audio.isMuted) {
                    textMusic.innerText = '暂停';
                    iconMusic.style.animation = 'spin 3.6s linear infinite';
                    btnToggleMusic.style.background = 'rgba(212, 175, 55, 0.35)';
                    btnToggleMusic.style.borderColor = 'rgba(212, 175, 55, 0.8)';
                } else {
                    textMusic.innerText = '拍卖音';
                    iconMusic.style.animation = 'none';
                    btnToggleMusic.style.background = 'rgba(255, 255, 255, 0.1)';
                    btnToggleMusic.style.borderColor = 'rgba(212, 175, 55, 0.3)';
                }
            }
        })();
    </script>
</body>
</html>
